[package]
name = "igfast"
version = "1.0.0"
edition = "2021"
description = "The fast half of InstaBaileys — bulk Instagram listing, diffing and actions over plain HTTPS."

[[bin]]
name = "igfast"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json", "gzip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
