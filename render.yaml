# Render blueprint for InstaBaileys.
#
# One click: this creates a web service on the free plan. Put the session
# cookie in IGBOT_SESSIONID and the API token in IGBOT_API_TOKEN, then
# deploy.
#
# The free plan gives 512 MB of RAM. That is enough here — the bot uses
# about 70 MB — because there is no browser in the image.

services:
  - type: web
    name: instabaileys
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The sessionid cookie from your browser. This is the whole login.
      - key: IGBOT_SESSIONID
        sync: false
      # Protects every route except /api/health.
      - key: IGBOT_API_TOKEN
        sync: false
      # Optional: the AI backend.
      - key: OPENAI_API_KEY
        sync: false
      - key: IGBOT_LOG_LEVEL
        value: INFO
      - key: IGBOT_API_PORT
        value: "8000"
