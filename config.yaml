# InstaBaileys configuration.
#
# Everything you are likely to change lives in this file. It is read on every
# start, so you can edit it and restart without reinstalling anything.
#
# Secrets do NOT belong in this file. Put the session cookie in
# secrets/cookies.txt (or in the IGBOT_SESSIONID environment variable) and
# the password in IGBOT_PASSWORD.

account:
  # Your Instagram username. Used for the self test and for the /whoami command.
  username: "typical_me.11"

  # Where the session cookie lives. Use "secrets/cookies.txt", or "-" to paste
  # it on stdin. The file may hold a raw Cookie header, a cookies.txt export
  # or a browser JSON export — all three are understood.
  cookies_file: "secrets/cookies.txt"

  # The password is only used when there is no cookie. Leave it empty and
  # export IGBOT_PASSWORD instead of writing it here.
  password: ""

session:
  # The saved session and the device identity. Keep this file: it is what
  # stops Instagram from seeing a new device on every restart.
  settings_file: "state/session.json"

network:
  # Only needed when the account is used from a country Instagram does not
  # expect. Example: "http://user:pass@host:port".
  proxy: ""

  # A random pause between API calls, in seconds. It looks human and keeps
  # the request rate far away from any limit.
  delay_range: [1, 3]

  request_timeout: 10
  session_retries: 3

state:
  # The SQLite database: what has been answered, the counters, the queue.
  database: "state/igbot.db"

behaviour:
  # How often to check the inbox, in seconds.
  poll_seconds: 45

  # How many conversations to read per poll.
  thread_count: 25

  # Read the "message requests" folder too (people who wrote to you first).
  read_requests: true

  # How long to wait before answering, randomly inside this range. People do
  # not reply instantly. Neither should the bot.
  reply_delay_min: 12
  reply_delay_max: 55

  # Minimum gap between two answers in the same conversation.
  cooldown_seconds: 900

  # Reply caps. These are what stops a busy day from turning into a flood.
  hourly_cap: 8
  daily_cap: 25
  global_daily_cap: 120

  # True = read and log, never answer. Turn this on for the first few days.
  baseline_only: true

  # Accepting a message request is a visible action, so it is your call.
  accept_requests: false

  # How often the automatic actions (stories, likes, follow back) run.
  automations_every_seconds: 900

  # Caps for the visible actions — likes, follows, story views. These are
  # tighter than the DM caps on purpose: a burst of follows and likes is
  # exactly what makes an account look automated.
  action_caps:
    like:            { hourly: 20, daily: 100 }
    unlike:          { hourly: 20, daily: 100 }
    follow:          { hourly: 5,  daily: 20 }
    unfollow:        { hourly: 5,  daily: 20 }
    comment_reply:   { hourly: 8,  daily: 30 }
    story_reply:     { hourly: 5,  daily: 20 }
    story_view:      { hourly: 20, daily: 80 }
    story_like:      { hourly: 20, daily: 80 }
    story_post:      { hourly: 2,  daily: 6 }

automations:
  enabled: true

  # The default state of each automatic action. The /auto commands in the DM
  # change these at runtime, and they are remembered.
  default_view: false     # view the stories of the people you follow
  default_like: false     # like their posts
  default_story: false    # like their stories
  default_follow: false   # follow the people who followed you
  default_comment: false  # answer comments on your posts
  default_note: true      # read the notes that arrive
  default_welcome: false  # say hello to new followers
  default_storypost: false  # publish a story from the story folder

  # What a new follower gets. {username} and {name} are replaced.
  welcome_message: "Thanks for following! If you have any questions, just send us a message."

  # What a new comment gets.
  comment_message: "Thanks for the comment! {username} — we really appreciate it."

  # How many of your own posts to check for comments.
  comment_posts: 3

  # A folder of photos that are published as stories, one per run.
  story_folder: ""
  story_caption: ""

  # Recurring work. "09:00" is every day at 09:00; "every 30m" is every half
  # hour. The kind is any task kind.
  schedules: []
    # - name: morning_stories
    #   kind: auto:view
    #   schedule: "09:00"

# The risk controls. These are the rules that keep the account from looking
# automated — and they are the reason it does not get restricted.
risk:
  # How many API calls per hour. Instagram allows far more, but a few
  # hundred an hour is exactly what a person browsing the app does.
  requests_per_hour: 600

  # The total number of visible actions per day, whatever the per-kind
  # caps say. Likes, follows, story views, comments and welcomes all
  # count towards this one number.
  daily_visible_ceiling: 60

  # The pause between any two visible actions, in seconds. The bot picks a
  # random time inside this range. This single rule removes more risk than
  # every other one put together.
  min_visible_gap_seconds: 20
  max_visible_gap_seconds: 75

  # How many visible actions may happen inside one burst window.
  burst_limit: 3
  burst_window_seconds: 600

  # The same text is never sent twice inside this window.
  dedupe_hours: 12

  # A new account is allowed very little at first: 15% on day one, 40%
  # after two days, 70% after six, and the full amount after thirteen.
  warmup_days: [2, 6, 13]

  # How long the bot stops acting when Instagram pushes back. It is
  # doubled every time it happens again.
  safe_mode_minutes: 60

# Which app identity the bot wears. Instagram expects a very specific app
# version, and a version that is too old starts failing quietly.
protocol:
  reprobe_seconds: 86400
  protocol_file: "state/protocol.json"

# Instagram's push channel. When it works, answers go out in seconds
# instead of waiting for the next poll. The bot falls back to polling if
# the connection cannot be made.
realtime:
  enabled: true

reply:
  # Sent when nothing more specific matches.
  default_reply: "Thanks for reaching out! We've got your message and will reply shortly."

  # A marker in front of every answer, so you can tell them apart in the
  # inbox. Set it to "" to turn it off.
  marker: ""

  # The reply book. Order does not matter — the most specific match wins.
  # Matching is on word boundaries, so "hi" will NOT fire on "shipping".
  rules:
    - name: pricing
      match: ["price", "pricing", "how much", "cost"]
      reply: "Happy to help with pricing! What are you looking to order?"

    - name: shipping
      match: ["shipping", "delivery", "how long", "postage"]
      reply: "We ship nationwide. Could you tell me where you're based?"

    - name: returns
      match: ["return", "refund", "exchange"]
      reply: "We accept returns within 30 days. Which order is this about?"

    - name: stock
      match: ["in stock", "available", "do you have"]
      reply: "Let me check availability for you — which item are you after?"

    - name: greeting
      match: ["hi", "hello", "hey", "good morning", "good evening"]
      reply: "Hi there! How can I help?"

    - name: thanks
      match: ["thanks", "thank you", "cheers"]
      reply: "Happy to help! Anything else I can do for you?"

  # Optional AI answers. Off by default. Any OpenAI-compatible endpoint works.
  # If the AI is down or slow, the rules above are used instead and your
  # customer is never left without an answer.
  ai:
    enabled: false
    endpoint: ""
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4o-mini"
    timeout: 20
    max_tokens: 160

api:
  # The HTTP control API. Needs IGBOT_API_TOKEN in the environment; without a
  # token every route except /api/health stays closed.
  enabled: false
  port: 8000

keepalive:
  # Pings the bot's own health endpoint so a free Render instance is never
  # put to sleep while it is waiting for a customer.
  enabled: true
  host: "127.0.0.1"
  interval_seconds: 240

publishing:
  caption_file: ""
  media_file: ""
  media_url: ""

logging:
  level: "INFO"
  file: "logs/igbot.log"
